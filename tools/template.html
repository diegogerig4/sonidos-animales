<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Olivia">
<meta name="theme-color" content="#F4EFE6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-olivia-180.png">
<title>Los animales de Olivia</title>
<style>
/* Diseño tranquilo: colores apagados, sin animaciones llamativas, sin saltos de animal en animal. */
:root{
  --bg:#F4EFE6; --card:#FBF8F2; --ink:#4A4237; --ink2:#8A7F70; --line:#E6DED0;
  --accent:#7E9A7A; --accent-soft:#E3EBDF; --photo-bg:#ECE5D8;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
img{-webkit-user-drag:none;display:block}
#app{max-width:900px;margin:0 auto;padding:0 18px calc(var(--sb) + 28px)}
.view{animation:in .35s ease}
@keyframes in{from{opacity:0}to{opacity:1}}

/* Inicio */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--st) + 22px) 2px 8px}
.top h1{margin:0;font-size:26px;font-weight:600;letter-spacing:.01em}
.lock{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);opacity:.45;flex:none}
.lock svg.ring{position:absolute;inset:0;width:40px;height:40px;transform:rotate(-90deg)}
.lock svg.ring circle{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:114;stroke-dashoffset:114}
.lock.hold svg.ring circle{transition:stroke-dashoffset 1.9s linear;stroke-dashoffset:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:9px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:16px;color:var(--ink2)}
.cat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{display:block;width:100%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);text-align:left}
.card .ph{aspect-ratio:4/3;background:var(--photo-bg)}
.card img{width:100%;height:100%;object-fit:contain}
.card span{display:block;padding:9px 12px 11px;font-size:18px;font-weight:500}
.game-link{display:block;width:100%;margin:22px 0 0;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:17px;color:var(--ink2);text-align:center}

/* Ficha del animal */
.detail{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 0 calc(var(--sb) + 20px)}
.back{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 8px;border-radius:14px;color:var(--ink2);font-size:17px}
.back svg{width:22px;height:22px}
.big{flex:1;display:flex;align-items:center;justify-content:center;margin:10px 0;border-radius:22px;background:var(--photo-bg);overflow:hidden;min-height:0}
.big img{width:100%;height:100%;max-height:62vh;object-fit:contain}
.name{text-align:center;font-size:40px;font-weight:600;margin:10px 0 18px}
.listen{align-self:center;display:flex;align-items:center;gap:12px;padding:16px 30px;border-radius:40px;background:var(--accent-soft);border:1px solid var(--accent);font-size:20px;color:var(--ink);transition:opacity .3s}
.listen svg{width:28px;height:28px;color:var(--accent)}
.listen[disabled]{opacity:.45}
.nosound{text-align:center;color:var(--ink2);font-size:15px}

/* Descanso */
.rest{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.rest .leaf{width:90px;height:90px;color:var(--accent);opacity:.8}
.rest h2{font-size:30px;font-weight:600;margin:22px 0 10px}
.rest p{font-size:19px;color:var(--ink2);margin:0;max-width:360px;line-height:1.45}
.rest .lock{margin-top:60px}

/* Juego (opcional) */
.game{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 0 calc(var(--sb) + 18px)}
.question{text-align:center;font-size:28px;font-weight:600;margin:10px 0 16px}
.choices{flex:1;display:grid;gap:14px;grid-template-rows:repeat(var(--n),1fr);min-height:0}
@media (orientation:landscape){.choices{grid-template-rows:1fr;grid-template-columns:repeat(var(--n),1fr)}}
.choice{border-radius:20px;overflow:hidden;background:var(--photo-bg);border:3px solid transparent;min-height:0;transition:opacity .4s,border-color .4s}
.choice img{width:100%;height:100%;object-fit:contain}
.choice.ok{border-color:var(--accent)}
.choice.dim{opacity:.3}
.again{align-self:center;margin-top:16px;padding:14px 28px;border-radius:30px;background:var(--card);border:1px solid var(--line);font-size:18px;visibility:hidden}
.again.show{visibility:visible}

/* Zona de papá y mamá */
.parents{padding-top:calc(var(--st) + 10px)}
.ph{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.ph h1{font-size:26px;margin:0;font-weight:600}
.pill{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:9px 16px;font-weight:500}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);font-weight:600;margin:24px 4px 8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:18px;background:none;color:var(--ink);-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left;min-height:64px}
.row + .row{border-top:1px solid var(--line)}
.row img,.row .ph0{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--photo-bg);flex:none}
.row .t{flex:1;min-width:0}
.row .t1{font-size:17px;font-weight:500}
.row .t2{font-size:13px;color:var(--ink2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .x{width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--ink2);flex:none}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:12px}
.opt + .opt{border-top:1px solid var(--line)}
.opt .s{font-size:13px;color:var(--ink2);margin-top:2px}
.switch{position:relative;width:51px;height:31px;border-radius:16px;background:#DDD4C4;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;flex:none}
.seg button{padding:7px 12px;border-radius:9px;color:var(--ink2);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.status{color:var(--ink2);text-align:center;padding:24px 16px;font-size:15px}
.credits{font-size:13px;color:var(--ink2);line-height:1.45;padding:12px 16px}
.credits a{color:var(--ink2)}
.credits p{margin:0 0 8px}
details summary{list-style:none;padding:14px 16px;font-weight:500;cursor:pointer}
details summary::-webkit-details-marker{display:none}
.note{font-size:14px;color:var(--ink2);margin:8px 4px 0;line-height:1.45}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin:0 16px 14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Los animales de Olivia. Fotos reales revisadas a mano (iNaturalist) y sonidos reales (iNaturalist y Wikimedia Commons). */
const ANIMALS = __DATA__;
const CATS = [
  { k: "todos", name: "Todos" },
  { k: "mamiferos", name: "Mamíferos" },
  { k: "aves", name: "Aves" },
  { k: "reptiles", name: "Reptiles" },
  { k: "anfibios", name: "Anfibios" },
  { k: "insectos", name: "Insectos" },
  { k: "mas", name: "Más" }
];
const API = "https://api.inaturalist.org/v1";
const ANIMAL_GROUPS = ["Mammalia","Aves","Reptilia","Amphibia","Actinopterygii","Insecta","Arachnida","Mollusca","Animalia"];
const $app = document.getElementById("app");
const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC[c]);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const noun = n => n.replace(/^(el|la|los|las) /i, "");
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
async function getJSON(u){ const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
const loading = t => `<p class="status">${esc(t)}</p>`;
const SET = {
  voice: lsGet("voice") !== "0",
  game: lsGet("game") === "1",
  limit: lsGet("limit") === null ? 5 : +lsGet("limit"),
  opts: +(lsGet("opts") || 2),
  cat: lsGet("cat") || "todos"
};
let EXTRA = []; try { EXTRA = JSON.parse(lsGet("extra") || "[]"); } catch(e){}
const byKey = k => ANIMALS.find(a => a.k === k) || EXTRA.find(a => a.k === k);
const thumbOf = a => a.thumb || a.photo;
const ICON = {
  back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>`,
  ear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path d="M17.5 8.5a5 5 0 0 1 0 7"/></svg>`,
  gear: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>`,
  search: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 5 5"/></svg>`,
  leaf: `<svg class="leaf" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 52C12 28 28 12 54 10c0 26-16 42-38 42"/><path d="M12 52c10-12 20-22 30-30"/></svg>`
};

/* ---------- Límite de animales por rato ---------- */
// Cuenta los animales vistos. Al llegar al límite sale una pantalla de descanso que solo
// papá o mamá pueden quitar (manteniendo pulsado). Se reinicia sola tras 30 minutos sin usarla.
const SES = (() => {
  let s = { n: 0, t: 0 }; try { s = JSON.parse(lsGet("ses") || "") || s; } catch(e){}
  if (Date.now() - s.t > 30 * 60 * 1000) s = { n: 0, t: 0 };
  return s;
})();
function countOne(){ SES.n++; SES.t = Date.now(); lsSet("ses", JSON.stringify(SES)); }
function touchSession(){ SES.t = Date.now(); lsSet("ses", JSON.stringify(SES)); }
const limitReached = () => SET.limit > 0 && SES.n >= SET.limit;
function resetSession(){ SES.n = 0; SES.t = Date.now(); lsSet("ses", JSON.stringify(SES)); }

/* ---------- Sonido y voz ---------- */
const AU = new Audio(); AU.preload = "none"; AU.setAttribute("playsinline", "");
let unlocked = false;
function unlock(){
  if (unlocked) return; unlocked = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
}
document.addEventListener("touchend", unlock, { passive: true });
document.addEventListener("click", unlock);
document.addEventListener("gesturestart", e => e.preventDefault());
let VOICE = null;
function pickVoice(){
  if (!window.speechSynthesis) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v => v.lang === "es-ES" && /m[oó]nica|marisol|paulina|elvira|helena/i.test(v.name))
       || vs.find(v => v.lang === "es-ES") || vs.find(v => (v.lang || "").startsWith("es")) || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  return new Promise(res => {
    if (!SET.voice || !window.speechSynthesis) return res();
    let done = false; const fin = () => { if (!done){ done = true; res(); } };
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-ES"; if (VOICE) u.voice = VOICE; u.rate = .78; u.pitch = 1;
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    } catch(e){ fin(); }
    setTimeout(fin, 1200 + text.length * 120);
  });
}
function playURL(url){
  return new Promise(res => {
    let done = false, timer;
    const fin = () => { if (done) return; done = true; clearTimeout(timer); AU.onended = AU.onerror = null; res(); };
    try {
      AU.pause(); AU.volume = 1; AU.src = url;
      AU.onended = fin; AU.onerror = fin;
      AU.play().catch(fin);
      timer = setTimeout(() => { AU.pause(); fin(); }, 10000);
    } catch(e){ fin(); }
  });
}
let TOK = 0;
function stopAll(){ TOK++; try { speechSynthesis.cancel(); } catch(e){} AU.pause(); }
const clipIdx = {};
function soundsOf(a){ return a.clips ? a.clips.map(c => "sounds/" + c.file) : (a.sounds || []); }
async function playAnimal(a){
  const list = soundsOf(a);
  if (!list.length) return false;
  const i = clipIdx[a.k] = ((clipIdx[a.k] ?? -1) + 1) % list.length;
  await playURL(list[i]);
  return true;
}

/* ---------- Navegación ---------- */
window.addEventListener("hashchange", route);
function route(){
  stopAll();
  window.scrollTo(0, 0);
  const h = location.hash || "#/";
  if (h.startsWith("#/padres")) return showParents();
  if (h.startsWith("#/t/")) return showTaxon(parseInt(h.slice(4), 10));
  if (limitReached()) return showRest();
  if (h.startsWith("#/a/")) return showAnimal(decodeURIComponent(h.slice(4)));
  if (h.startsWith("#/juego") && SET.game) return showGame();
  showHome();
}
function listFor(cat){
  if (cat === "mas") return EXTRA;
  if (cat === "todos") return ANIMALS.concat(EXTRA);
  return ANIMALS.filter(a => a.cat === cat);
}
function holdToOpen(el, ms, cb){
  let t;
  const start = e => { e.preventDefault(); el.classList.add("hold"); t = setTimeout(() => { el.classList.remove("hold"); cb(); }, ms); };
  const end = () => { clearTimeout(t); el.classList.remove("hold"); };
  el.addEventListener("touchstart", start, { passive: false });
  el.addEventListener("mousedown", start);
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev => el.addEventListener(ev, end));
}
const lockBtn = id => `<button class="lock" id="${id}" aria-label="Papá y mamá (mantén pulsado)"><svg class="ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"/></svg>${ICON.gear}</button>`;

/* ---------- Inicio ---------- */
function showHome(){
  document.title = "Los animales de Olivia";
  const cats = CATS.filter(c => c.k === "todos" || listFor(c.k).length);
  if (!cats.find(c => c.k === SET.cat)) SET.cat = "todos";
  $app.innerHTML = `<div class="view">
    <header class="top"><h1>Animales</h1>${lockBtn("lock")}</header>
    <div class="cats">${cats.map(c => `<button class="cat" data-k="${c.k}" aria-pressed="${c.k === SET.cat}">${c.name}</button>`).join("")}</div>
    <div class="grid" id="grid"></div>
    ${SET.game ? `<button class="game-link" id="gameBtn">Jugar a «¿Dónde está?»</button>` : ""}
  </div>`;
  renderGrid();
  document.querySelectorAll(".cat").forEach(b => b.onclick = () => {
    SET.cat = b.dataset.k; lsSet("cat", SET.cat);
    document.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderGrid();
  });
  const g = document.getElementById("gameBtn"); if (g) g.onclick = () => location.hash = "#/juego";
  holdToOpen(document.getElementById("lock"), 2000, () => location.hash = "#/padres");
  const sc = sessionStorage.getItem("homeY"); if (sc) setTimeout(() => window.scrollTo(0, +sc), 0);
}
function renderGrid(){
  const g = document.getElementById("grid");
  g.innerHTML = listFor(SET.cat).map(a => `<button class="card" data-k="${esc(a.k)}"><div class="ph"><img src="${esc(thumbOf(a))}" alt="" loading="lazy" decoding="async"></div><span>${esc(cap(noun(a.name)))}</span></button>`).join("");
  g.querySelectorAll(".card").forEach(c => c.onclick = () => {
    sessionStorage.setItem("homeY", window.scrollY);
    location.hash = "#/a/" + encodeURIComponent(c.dataset.k);
  });
}

/* ---------- Ficha: una foto entera, su nombre y un botón para escucharlo ---------- */
function detailHTML(a, extra){
  const has = soundsOf(a).length > 0;
  return `<div class="detail view">
    <button class="back" id="backBtn">${ICON.back}Volver</button>
    <div class="big"><img src="${esc(a.photo)}" alt="${esc(a.name)}" decoding="async"></div>
    <div class="name">${esc(cap(noun(a.name)))}</div>
    ${has ? `<button class="listen" id="listen">${ICON.ear}Escuchar</button>` : `<p class="nosound">Todavía no tenemos su sonido real.</p>`}
    ${extra || ""}
  </div>`;
}
function bindListen(a){
  const b = document.getElementById("listen"); if (!b) return;
  b.onclick = async () => {
    if (b.disabled) return;
    b.disabled = true; touchSession();
    const t = ++TOK;
    await say(cap(a.name));
    if (t === TOK) await playAnimal(a);
    setTimeout(() => { if (document.body.contains(b)) b.disabled = false; }, 1200);
  };
}
function showAnimal(k){
  const a = byKey(k);
  if (!a) return location.replace("#/");
  document.title = cap(noun(a.name)) + " · Olivia";
  countOne();
  $app.innerHTML = detailHTML(a);
  document.getElementById("backBtn").onclick = () => history.length > 1 ? history.back() : location.replace("#/");
  bindListen(a);
}

/* ---------- Descanso ---------- */
function showRest(){
  document.title = "A descansar · Olivia";
  $app.innerHTML = `<div class="rest view">
    ${ICON.leaf}
    <h2>Ya está por hoy</h2>
    <p>Ahora vamos a buscar animales de verdad: pájaros, perros, gatos… ¿Qué oímos fuera?</p>
    ${lockBtn("restLock")}
  </div>`;
  holdToOpen(document.getElementById("restLock"), 2000, () => { resetSession(); location.replace("#/"); route(); });
}

/* ---------- Animales buscados por papá y mamá ---------- */
const taxCache = {};
async function loadTaxon(id){
  if (taxCache[id]) return taxCache[id];
  const both = await Promise.all([
    getJSON(`${API}/taxa/${id}?locale=es`).then(d => d.results[0]),
    getJSON(`${API}/observations?taxon_id=${id}&sounds=true&quality_grade=research&order_by=votes&per_page=12`).catch(() => ({ results: [] }))
  ]);
  const t = both[0], o = both[1];
  const ph = ((t.taxon_photos || [])[0] || {}).photo || t.default_photo || {};
  const sounds = [], credits = [];
  o.results.forEach(ob => (ob.sounds || []).slice(0, 1).forEach(s => { if (s.file_url){ sounds.push(s.file_url); credits.push((ob.user || {}).name || (ob.user || {}).login); } }));
  const big = (ph.medium_url || ph.url || "").replace(/square|small|medium/, "large");
  return taxCache[id] = {
    k: "t" + id, id, name: cap(t.preferred_common_name) || t.name, sci: t.name, cat: "mas",
    photo: big, thumb: big.replace("large", "medium"), photo_by: ph.attribution || "",
    sounds: sounds.slice(0, 4), credits
  };
}
async function showTaxon(id){
  $app.innerHTML = loading("Cargando…");
  let a;
  try { a = await loadTaxon(id); } catch(e){ $app.innerHTML = loading("No se pudo cargar. Revisa la conexión."); return; }
  const added = () => EXTRA.some(x => x.k === a.k);
  $app.innerHTML = detailHTML(a, `<button class="pill" id="addBtn" style="align-self:center;margin-top:18px">${added() ? "✓ En sus animales (quitar)" : "＋ Añadir a sus animales"}</button>
    <p class="note" style="text-align:center">Mira bien la foto antes de añadirla.</p>`);
  document.getElementById("backBtn").onclick = () => location.hash = "#/padres";
  bindListen(a);
  document.getElementById("addBtn").onclick = e => {
    if (added()) EXTRA = EXTRA.filter(x => x.k !== a.k);
    else EXTRA.push({ k: a.k, id: a.id, name: a.name, sci: a.sci, cat: "mas", photo: a.photo, thumb: a.thumb, photo_by: a.photo_by, sounds: a.sounds, credits: a.credits });
    lsSet("extra", JSON.stringify(EXTRA));
    e.currentTarget.textContent = added() ? "✓ En sus animales (quitar)" : "＋ Añadir a sus animales";
  };
}

/* ---------- Juego tranquilo (opcional, desactivado al principio) ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
let lastTarget = null;
function showGame(){
  document.title = "¿Dónde está? · Olivia";
  if (limitReached()) return showRest();
  countOne();
  let pool = listFor(SET.cat).filter(a => soundsOf(a).length);
  if (pool.length < SET.opts + 1) pool = ANIMALS.slice();
  let target; do { target = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && target === lastTarget);
  lastTarget = target;
  const opts = shuffle([target].concat(shuffle(pool.filter(a => a !== target && noun(a.name) !== noun(target.name))).slice(0, SET.opts - 1)));
  $app.innerHTML = `<div class="game view">
    <button class="back" id="backBtn">${ICON.back}Volver</button>
    <div class="question">¿Dónde está ${esc(target.name)}?</div>
    <div class="choices" style="--n:${opts.length}">${opts.map(a => `<button class="choice" data-k="${esc(a.k)}"><img src="${esc(a.photo)}" alt=""></button>`).join("")}</div>
    <button class="again" id="again">Otro animal</button>
  </div>`;
  document.getElementById("backBtn").onclick = () => location.hash = "#/";
  document.getElementById("again").onclick = () => showGame();
  setTimeout(() => say("¿Dónde está " + target.name + "?"), 500);
  let solved = false, busy = false;
  document.querySelectorAll(".choice").forEach(btn => btn.onclick = async () => {
    if (solved || busy) return;
    busy = true;
    const a = byKey(btn.dataset.k), t = ++TOK;
    if (a === target){
      solved = true;
      btn.classList.add("ok");
      document.querySelectorAll(".choice").forEach(b => { if (b !== btn) b.classList.add("dim"); });
      await say("Sí. Es " + a.name + ".");
      if (t === TOK) await playAnimal(a);
      document.getElementById("again")?.classList.add("show");
    } else {
      await say("Este es " + a.name + ".");
      if (t === TOK) await say("¿Dónde está " + target.name + "?");
    }
    busy = false;
  });
}

/* ---------- Zona de papá y mamá ---------- */
function showParents(){
  document.title = "Papá y mamá · Olivia";
  $app.innerHTML = `<div class="parents view">
    <div class="ph"><h1>Papá y mamá</h1><button class="pill" id="back">Volver</button></div>
    <div class="sec">Para que no sea demasiado</div>
    <div class="box">
      <div class="opt"><div><div>Animales por rato</div><div class="s">Después sale una pantalla de descanso. Se reinicia sola a los 30 minutos.</div></div>
        <div class="seg" id="limSeg">${[[3,"3"],[5,"5"],[8,"8"],[0,"Sin límite"]].map(([n,l]) => `<button data-n="${n}" aria-pressed="${SET.limit === n}">${l}</button>`).join("")}</div></div>
      <div class="opt"><div><div>Decir el nombre</div><div class="s">Al pulsar «Escuchar», la voz del móvil dice el nombre antes del sonido.</div></div>
        <button class="switch" id="vsw" role="switch" aria-checked="${SET.voice}"></button></div>
      <div class="opt"><div><div>Juego «¿Dónde está?»</div><div class="s">Desactivado al principio. Tranquilo: sin premios ni prisas.</div></div>
        <button class="switch" id="gsw" role="switch" aria-checked="${SET.game}"></button></div>
      <div class="opt"><div><div>Fotos en el juego</div></div>
        <div class="seg" id="optSeg">${[2,3].map(n => `<button data-n="${n}" aria-pressed="${SET.opts === n}">${n}</button>`).join("")}</div></div>
      <div class="opt"><div><div>Quitar la pantalla de descanso</div><div class="s">Ahora lleva ${SES.n} animal${SES.n === 1 ? "" : "es"} en este rato.</div></div>
        <button class="pill" id="resetSes">Empezar de cero</button></div>
    </div>
    <div class="sec">Buscar otro animal</div>
    <label class="search">${ICON.search}<input id="q" type="search" placeholder="Fénec, gorila, cocodrilo…" autocomplete="off" autocorrect="off" enterkeyhint="search"></label>
    <div id="res" style="margin-top:12px"></div>
    <p class="note">Las fotos de los animales de la app están revisadas una a una. Las de esta búsqueda no: miradlas antes de añadirlas.</p>
    <div class="sec">Añadidos por vosotros</div>
    <div class="box" id="extraBox"></div>
    <div class="sec">Sin internet</div>
    <div class="box">
      <div class="opt"><div><div>Guardar todo en el móvil</div><div class="s">Fotos y sonidos de sus ${ANIMALS.length} animales.</div></div>
        <button class="pill" id="dl">Guardar</button></div>
      <div class="bar" id="dlbar" hidden><i></i></div>
    </div>
    <div class="sec">De dónde sale todo</div>
    <div class="box"><details><summary>Créditos de fotos y sonidos</summary><div class="credits">${creditsHTML()}</div></details></div>
    <p class="note">Fotos y sonidos de animales reales, hechos por naturalistas en iNaturalist y Wikimedia Commons. Uso personal, sin fines comerciales.</p>
  </div>`;
  document.getElementById("back").onclick = () => location.hash = "#/";
  const seg = (id, key, conv) => document.querySelectorAll(`#${id} button`).forEach(b => b.onclick = () => {
    SET[key] = conv(b.dataset.n); lsSet(key, SET[key]);
    document.querySelectorAll(`#${id} button`).forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  seg("limSeg", "limit", Number); seg("optSeg", "opts", Number);
  const sw = (id, key) => document.getElementById(id).onclick = e => { SET[key] = !SET[key]; lsSet(key, SET[key] ? "1" : "0"); e.currentTarget.setAttribute("aria-checked", SET[key]); };
  sw("vsw", "voice"); sw("gsw", "game");
  document.getElementById("resetSes").onclick = e => { resetSession(); e.currentTarget.textContent = "Hecho ✓"; };
  const q = document.getElementById("q");
  let t;
  q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => doSearch(q.value.trim()), 350); });
  q.addEventListener("keydown", e => { if (e.key === "Enter") q.blur(); });
  document.getElementById("dl").onclick = saveOffline;
  renderExtra();
}
function renderExtra(){
  const box = document.getElementById("extraBox"); if (!box) return;
  box.innerHTML = EXTRA.length ? EXTRA.map(a => `<div class="row"><img src="${esc(thumbOf(a))}" alt=""><div class="t"><div class="t1">${esc(a.name)}</div><div class="t2">${esc(a.sci)}</div></div><button class="x" data-k="${esc(a.k)}" aria-label="Quitar">✕</button></div>`).join("")
    : `<p class="status">Aún no habéis añadido ninguno.</p>`;
  box.querySelectorAll(".x").forEach(b => b.onclick = () => { EXTRA = EXTRA.filter(a => a.k !== b.dataset.k); lsSet("extra", JSON.stringify(EXTRA)); renderExtra(); });
}
let sSeq = 0;
async function searchAnimals(q){
  const found = new Map();
  const isAnimal = t => ANIMAL_GROUPS.includes(t.iconic_taxon_name);
  const add = list => list.filter(isAnimal).forEach(t => { if (!found.has(t.id)) found.set(t.id, t); });
  const ac = term => getJSON(`${API}/taxa/autocomplete?q=${encodeURIComponent(term)}&locale=es&per_page=20&is_active=true`).then(d => d.results).catch(() => []);
  add(await ac(q));
  const words = q.split(" ").filter(x => x.length >= 3);
  if (found.size < 3 || words.length > 1){
    if (words.length > 1){
      const lists = await Promise.all(words.map(w => ac(w).then(r => r.filter(isAnimal))));
      lists.filter(l => l.length).sort((a, b) => a.length - b.length).forEach(add);
    }
    if (found.size < 3){
      try {
        const w = await getJSON(`https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=3&format=json&origin=*`);
        for (const h of w.query.search) add(await ac(h.title.split(" (")[0]));
      } catch(e){}
    }
  }
  return Array.from(found.values()).slice(0, 30);
}
async function doSearch(q){
  const box = document.getElementById("res"), seq = ++sSeq;
  if (q.length < 2){ box.innerHTML = ""; return; }
  box.innerHTML = loading("Buscando…");
  const res = await searchAnimals(q);
  if (seq !== sSeq) return;
  box.innerHTML = res.length ? `<div class="box">${res.map(t => `<button class="row" data-id="${t.id}">
      ${t.default_photo && t.default_photo.square_url ? `<img src="${esc(t.default_photo.square_url)}" alt="">` : `<span class="ph0"></span>`}
      <div class="t"><div class="t1">${esc(cap(t.preferred_common_name) || t.name)}</div><div class="t2">${esc(t.name)}</div></div></button>`).join("")}</div>`
    : `<p class="status">No encuentro «${esc(q)}». Prueba con otro nombre.</p>`;
  box.querySelectorAll(".row").forEach(r => r.onclick = () => location.hash = "#/t/" + r.dataset.id);
}
function creditsHTML(){
  const lic = l => (l || "").toUpperCase();
  return ANIMALS.map(a => `<p><b>${esc(cap(noun(a.name)))}</b> (<i>${esc(a.sci)}</i>). Foto: ${esc(a.photo_by)}. Sonido: ${a.clips.map(c => `<a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.by || "autor desconocido")}</a>, ${esc(c.src)}, ${esc(lic(c.lic))}`).join("; ")}.</p>`).join("");
}
async function saveOffline(){
  const bar = document.getElementById("dlbar"), btn = document.getElementById("dl");
  bar.hidden = false; btn.disabled = true; btn.textContent = "Guardando…";
  const urls = [];
  ANIMALS.forEach(a => { urls.push(a.photo, a.thumb); soundsOf(a).forEach(s => urls.push(s)); });
  let n = 0;
  for (const u of urls){
    try { await fetch(u); } catch(e){}
    n++; bar.firstElementChild.style.width = Math.round(n / urls.length * 100) + "%";
  }
  btn.textContent = "Guardado ✓";
}

/* ---------- Arranque ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
if (!location.hash) history.replaceState(null, "", "#/");
route();
</script>
