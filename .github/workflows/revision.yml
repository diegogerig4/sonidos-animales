name: Revisar fotos
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/review_photos.py"
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python3 tools/review_photos.py
      - name: Guardar hojas de revision en la rama revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv review /tmp/review
          git checkout --orphan revision
          git rm -rf --cached . > /dev/null
          rm -rf ./* .github
          mv /tmp/review ./review
          git add review
          git commit -m "Hojas de revision de fotos"
          git push -f origin revision
