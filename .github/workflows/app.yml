name: Construir la app de Olivia
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/photos.json"
      - "tools/build.py"
      - "tools/template.html"
permissions:
  contents: write
  pages: write
concurrency:
  group: olivia-app
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python3 tools/build.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html img tools/data.json
          git commit -m "App de Olivia: fotos revisadas y version tranquila" || echo "Sin cambios"
          git push
      - name: Actualizar la web
        continue-on-error: true
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds"
